name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # the shared workflow defaults python_version to 3.14, where wakewordlab
      # has no wheel and its sdist does not build, so the job failed before
      # reading a single licence. requires-python bars 3.13 and newer for the
      # same reason; this names a version the package supports.
      python_version: '3.12'
      # Known exception, not an approval. wakewordlab ships no licence
      # metadata, and its LICENSE file permits non-commercial use only. This
      # is not compatible with Apache-2.0. The plugin exists to wrap it, so
      # README.md and pyproject.toml tell users about the restriction.
      # pilosus matches the "name==version" string, so the pattern allows a
      # version suffix.
      exclude_packages: '(?i:^wakewordlab([=<>!~ @;].*)?$)'
