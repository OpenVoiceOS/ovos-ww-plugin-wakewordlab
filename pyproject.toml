[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ww-plugin-wakewordlab"
dynamic = ["version"]
description = "OVOS wake word plugin using wakewordlab"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
# wakewordlab publishes wheels for cp39 to cp312 only, and its 0.1.1 sdist
# cannot build ("wakewordlab/_loader/loader.pyx doesn't match any files"),
# so this plugin cannot be installed on 3.13 or newer at all. The bound is
# a fact about the dependency, not a preference; widen it when wakewordlab
# ships wheels or a buildable sdist.
requires-python = ">=3.9,<3.13"
dependencies = [
    "wakewordlab",
    "numpy",
    "ovos-plugin-manager",
]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[project.entry-points."opm.wake_word"]
ovos-ww-plugin-wakewordlab = "ovos_ww_plugin_wakewordlab:WakewordLabHotwordPlugin"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-ww-plugin-wakewordlab"

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
