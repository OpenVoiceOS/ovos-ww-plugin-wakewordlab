[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ww-plugin-wakewordlab"
dynamic = ["version"]
description = "OVOS wake word plugin using wakewordlab"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
# wakewordlab publishes wheels for cp39 to cp312 only, and its 0.1.1 sdist
# cannot build ("wakewordlab/_loader/loader.pyx doesn't match any files"),
# so this plugin cannot be installed on 3.13 or newer at all. The bound is
# a fact about the dependency, not a preference; widen it when wakewordlab
# ships wheels or a buildable sdist.
# The lower bound matches the CI matrix (3.10, 3.11, 3.12). wakewordlab does
# ship cp39 wheels, so 3.9 would probably work, but nothing tests it and a
# claim nothing tests is not a claim.
requires-python = ">=3.10,<3.13"
dependencies = [
    # one published release, 0.1.1. The floor names the version this plugin
    # is tested against rather than accepting whatever is on the index.
    "wakewordlab>=0.1.1",
    "numpy",
    # 2.2.0 is the floor because 2.1.1 and older import pkg_resources at
    # module scope, which setuptools no longer ships: on python 3.11
    # `import ovos_plugin_manager.templates.hotwords` raises
    # ModuleNotFoundError: No module named 'pkg_resources'. Measured at the
    # boundary: 2.1.1 fails, 2.2.0 imports.
    "ovos-plugin-manager>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[project.entry-points."opm.wake_word"]
ovos-ww-plugin-wakewordlab = "ovos_ww_plugin_wakewordlab:WakewordLabHotwordPlugin"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-ww-plugin-wakewordlab"

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
